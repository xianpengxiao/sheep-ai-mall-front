<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理中心 - 方案A 侧边栏导航</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #e8573a;
  --accent2: #f39c12;
  --gradient: linear-gradient(135deg, #e8573a 0%, #f39c12 100%);
  --bg: #f5f3f0;
  --surface: #fff;
  --text: #5a5a6e;
  --text-h: #1a1a2e;
  --border: #eeeae6;
  --sidebar-bg: #1a1920;
  --sidebar-text: rgba(255,255,255,0.7);
  --sidebar-active: rgba(232,87,58,0.2);
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* 侧边栏 */
.sidebar {
  width: 240px;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-brand {
  padding: 24px 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: 20px;
  font-weight: 800;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}
.sidebar-nav { flex: 1; padding: 12px 12px; }
.nav-section { margin-bottom: 8px; }
.nav-section-title {
  font-size: 11px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  padding: 8px 12px 6px;
  letter-spacing: 0.5px;
  font-weight: 600;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--sidebar-text);
  font-size: 14px;
  transition: all 0.15s;
  margin-bottom: 2px;
}
.nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-item.active {
  background: var(--sidebar-active);
  color: var(--accent);
  font-weight: 600;
}
.nav-icon { font-size: 16px; width: 20px; text-align: center; }

/* 主区域 */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header-title { font-size: 18px; font-weight: 700; color: var(--text-h); }
.header-user {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text);
}
.header-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
}

.content {
  flex: 1;
  padding: 24px 28px;
  overflow-y: auto;
}

/* 统计卡片行 */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.stat-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  margin-bottom: 12px;
}
.stat-icon.green { background: #e8f8e8; color: #2e7d32; }
.stat-icon.orange { background: #fff3e0; color: #e65100; }
.stat-icon.blue { background: #e3f2fd; color: #1565c0; }
.stat-icon.purple { background: #f3e5f5; color: #7b1fa2; }
.stat-number { font-size: 24px; font-weight: 800; color: var(--text-h); }
.stat-label { font-size: 13px; margin-top: 2px; }

/* 板块入口卡片 */
.section-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.section-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.2s;
}
.section-card:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.10);
  transform: translateY(-2px);
}
.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.section-header-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.section-header-icon.red { background: #fdecea; color: #c62828; }
.section-header-icon.orange { background: #fff3e0; color: #e65100; }
.section-header-icon.blue { background: #e3f2fd; color: #1565c0; }
.section-header-icon.green { background: #e8f8e8; color: #2e7d32; }
.section-title { font-size: 16px; font-weight: 700; color: var(--text-h); }
.section-items { display: flex; flex-direction: column; gap: 8px; }
.section-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--bg);
  border-radius: 8px;
  font-size: 13px;
}
.section-item span:first-child { color: var(--text); }
.section-item span:last-child { font-weight: 600; color: var(--text-h); }
.badge {
  display: inline-flex;
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.badge.red { background: #fdecea; color: #c62828; }
.badge.green { background: #e8f8e8; color: #2e7d32; }
.badge.orange { background: #fff3e0; color: #e65100; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand">SheepAI Admin</div>
  <div class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-section-title">概览</div>
      <div class="nav-item active"><span class="nav-icon">📊</span> 仪表盘</div>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">系统管理</div>
      <div class="nav-item"><span class="nav-icon">👥</span> 用户管理</div>
      <div class="nav-item"><span class="nav-icon">🔐</span> 角色管理</div>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">商品管理</div>
      <div class="nav-item"><span class="nav-icon">📦</span> 商品审核</div>
      <div class="nav-item"><span class="nav-icon">🏷️</span> 分类管理</div>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">商家管理</div>
      <div class="nav-item"><span class="nav-icon">🏪</span> 商家列表</div>
      <div class="nav-item"><span class="nav-icon">📋</span> 入驻审核</div>
      <div class="nav-item"><span class="nav-icon">✏️</span> 信息变更审核</div>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">评价管理</div>
      <div class="nav-item"><span class="nav-icon">⭐</span> 评价管理</div>
    </div>
  </div>
</div>
<div class="main">
  <div class="header">
    <div class="header-title">仪表盘</div>
    <div class="header-user">
      <span>Admin</span>
      <div class="header-avatar">A</div>
    </div>
  </div>
  <div class="content">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon green">👥</div>
        <div class="stat-number">128</div>
        <div class="stat-label">注册用户</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">📦</div>
        <div class="stat-number">12</div>
        <div class="stat-label">待审核商品</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon blue">🏪</div>
        <div class="stat-number">36</div>
        <div class="stat-label">入驻商家</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple">⭐</div>
        <div class="stat-number">8</div>
        <div class="stat-label">待处理评价</div>
      </div>
    </div>

    <div class="section-grid">
      <div class="section-card">
        <div class="section-header">
          <div class="section-header-icon red">⚙️</div>
          <div class="section-title">系统管理</div>
        </div>
        <div class="section-items">
          <div class="section-item"><span>用户管理</span><span>128 人</span></div>
          <div class="section-item"><span>角色管理</span><span>5 个角色</span></div>
        </div>
      </div>
      <div class="section-card">
        <div class="section-header">
          <div class="section-header-icon orange">📦</div>
          <div class="section-title">商品管理</div>
        </div>
        <div class="section-items">
          <div class="section-item"><span>商品审核</span><span class="badge orange">12 待审核</span></div>
          <div class="section-item"><span>分类管理</span><span>20 个分类</span></div>
        </div>
      </div>
      <div class="section-card">
        <div class="section-header">
          <div class="section-header-icon blue">🏪</div>
          <div class="section-title">商家管理</div>
        </div>
        <div class="section-items">
          <div class="section-item"><span>商家列表</span><span>36 家</span></div>
          <div class="section-item"><span>入驻审核</span><span class="badge orange">5 待审核</span></div>
          <div class="section-item"><span>信息变更审核</span><span class="badge orange">3 待处理</span></div>
        </div>
      </div>
      <div class="section-card">
        <div class="section-header">
          <div class="section-header-icon green">⭐</div>
          <div class="section-title">评价管理</div>
        </div>
        <div class="section-items">
          <div class="section-item"><span>评价管理</span><span class="badge red">8 条待处理</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
