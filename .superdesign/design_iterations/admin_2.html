<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理中心 - 方案B 卡片总览式</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #e8573a;
  --accent2: #f39c12;
  --gradient: linear-gradient(135deg, #e8573a 0%, #f39c12 100%);
  --bg: #f5f3f0;
  --surface: #fff;
  --text: #5a5a6e;
  --text-h: #1a1a2e;
  --border: #eeeae6;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* 顶部渐变条 */
.topbar {
  background: var(--gradient);
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #fff;
}
.topbar-brand {
  font-family: 'DM Sans', sans-serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.topbar-user {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  opacity: 0.9;
}
.topbar-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
}

/* 搜索行 */
.search-row {
  padding: 20px 32px 0;
  display: flex;
  gap: 12px;
}
.search-box {
  flex: 1;
  max-width: 320px;
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 0 14px;
  gap: 8px;
}
.search-box input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 14px;
  padding: 10px 0;
  background: transparent;
  color: var(--text-h);
}
.search-box input::placeholder { color: #c8c4c0; }
.search-box .icon { color: #c8c4c0; font-size: 16px; }

/* 内容区 */
.content { padding: 24px 32px; }
.greeting { font-size: 20px; font-weight: 700; color: var(--text-h); margin-bottom: 4px; }
.greeting-sub { font-size: 14px; color: var(--text); margin-bottom: 24px; }

/* 四板块大卡片 */
.modules {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}
.module {
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.25s;
}
.module:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.06);
  transform: translateY(-3px);
}
.module-top {
  padding: 28px 24px 20px;
  display: flex;
  align-items: flex-start;
  gap: 16px;
}
.module-icon-wrap {
  width: 52px; height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.module-icon-wrap.sys { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.module-icon-wrap.goods { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
.module-icon-wrap.merchant { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
.module-icon-wrap.review { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }

.module-info { flex: 1; }
.module-name { font-size: 18px; font-weight: 700; color: var(--text-h); margin-bottom: 4px; }
.module-desc { font-size: 13px; color: var(--text); line-height: 1.5; }
.module-stats {
  display: flex;
  gap: 20px;
  margin-top: 12px;
}
.module-stat {
  display: flex;
  flex-direction: column;
}
.module-stat-num { font-size: 20px; font-weight: 800; color: var(--text-h); }
.module-stat-label { font-size: 11px; color: var(--text); margin-top: 1px; }

.module-bottom {
  padding: 14px 24px;
  background: #faf8f6;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}
.module-bottom-left { display: flex; gap: 16px; }
.module-link { color: var(--accent); font-weight: 500; cursor: pointer; }
.module-link:hover { text-decoration: underline; }
.module-arrow { color: #c8c4c0; font-size: 16px; }
.badge-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  margin-right: 4px;
}
.badge-dot.orange { background: #f39c12; }
.badge-dot.red { background: #e8573a; }
.badge-dot.green { background: #43a047; }
.badge-num { font-weight: 600; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-brand">SheepAI 管理中心</div>
  <div class="topbar-user">
    <span>管理员</span>
    <div class="topbar-avatar">管</div>
  </div>
</div>

<div class="search-row">
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" placeholder="搜索功能、用户、商品..." />
  </div>
</div>

<div class="content">
  <div class="greeting">欢迎回来，管理员</div>
  <div class="greeting-sub">今天有 8 项待处理任务需要您的关注</div>

  <div class="modules">
    <!-- 系统管理 -->
    <div class="module">
      <div class="module-top">
        <div class="module-icon-wrap sys">⚙️</div>
        <div class="module-info">
          <div class="module-name">系统管理</div>
          <div class="module-desc">管理平台用户账号与系统角色权限配置</div>
          <div class="module-stats">
            <div class="module-stat"><span class="module-stat-num">128</span><span class="module-stat-label">注册用户</span></div>
            <div class="module-stat"><span class="module-stat-num">5</span><span class="module-stat-label">角色</span></div>
          </div>
        </div>
      </div>
      <div class="module-bottom">
        <div class="module-bottom-left">
          <span class="module-link">👥 用户管理</span>
          <span class="module-link">🔐 角色管理</span>
        </div>
        <span class="module-arrow">→</span>
      </div>
    </div>

    <!-- 商品管理 -->
    <div class="module">
      <div class="module-top">
        <div class="module-icon-wrap goods">📦</div>
        <div class="module-info">
          <div class="module-name">商品管理</div>
          <div class="module-desc">审核商家发布的商品，管理商品分类体系</div>
          <div class="module-stats">
            <div class="module-stat"><span class="module-stat-num"><span class="badge-dot orange"></span>12</span><span class="module-stat-label">待审核</span></div>
            <div class="module-stat"><span class="module-stat-num">20</span><span class="module-stat-label">分类</span></div>
          </div>
        </div>
      </div>
      <div class="module-bottom">
        <div class="module-bottom-left">
          <span class="module-link">📋 商品审核</span>
          <span class="module-link">🏷️ 分类管理</span>
        </div>
        <span class="module-arrow">→</span>
      </div>
    </div>

    <!-- 商家管理 -->
    <div class="module">
      <div class="module-top">
        <div class="module-icon-wrap merchant">🏪</div>
        <div class="module-info">
          <div class="module-name">商家管理</div>
          <div class="module-desc">查看入驻商家信息，审核入驻申请和信息变更</div>
          <div class="module-stats">
            <div class="module-stat"><span class="module-stat-num">36</span><span class="module-stat-label">商家</span></div>
            <div class="module-stat"><span class="module-stat-num"><span class="badge-dot orange"></span>5</span><span class="module-stat-label">待审核</span></div>
          </div>
        </div>
      </div>
      <div class="module-bottom">
        <div class="module-bottom-left">
          <span class="module-link">📋 商家列表</span>
          <span class="module-link">✅ 入驻审核</span>
          <span class="module-link">✏️ 变更审核</span>
        </div>
        <span class="module-arrow">→</span>
      </div>
    </div>

    <!-- 评价管理 -->
    <div class="module">
      <div class="module-top">
        <div class="module-icon-wrap review">⭐</div>
        <div class="module-info">
          <div class="module-name">评价管理</div>
          <div class="module-desc">管理用户评价内容，隐藏或删除违规评价</div>
          <div class="module-stats">
            <div class="module-stat"><span class="module-stat-num"><span class="badge-dot red"></span>8</span><span class="module-stat-label">待处理</span></div>
            <div class="module-stat"><span class="module-stat-num">1,280</span><span class="module-stat-label">总评价</span></div>
          </div>
        </div>
      </div>
      <div class="module-bottom">
        <div class="module-bottom-left">
          <span class="module-link">📝 评价管理</span>
        </div>
        <span class="module-arrow">→</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
